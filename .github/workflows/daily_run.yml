name: Educational Robot Daily Publisher

on:
  schedule:
    - cron: '0 16 * * *' # ينشر تلقائياً كل يوم الساعة 4 مساءً
  workflow_dispatch: # يتيح لك التشغيل اليدوي

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # تم التحديث للإصدار 4 المتوافق

      - name: Set up Python
        uses: actions/setup-python@v5 # تم التحديث للإصدار 5 المتوافق
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Salmano Robot
        run: python main.py
