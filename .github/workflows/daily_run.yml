name: Educational Robot Daily Publisher

on:
  schedule:
    # ينطلق الروبوت ذاتياً ومؤتمتاً في الخلفية يومياً الساعة 5:00 مساءً بتوقيت مكة (2:00 بتوقيت جرينتش)
    - cron: '0 14 * * *'
  workflow_dispatch: # يتيح لك تشغيله فوراً بيدك في أي وقت

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg and Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg ttf-mscorefonts-installer fonts-liberation

    - name: Install Dependencies
      run: |
        pip install gtts moviepy requests

    - name: Run Video Robot
      run: |
        python robot_free.py
